<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara created by Satya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: black; color: white; margin: 0; overflow: hidden; }
        .neon-text { text-shadow: 0 0 10px #e879f9, 0 0 20px #d946ef; }
        .debug-log { font-family: monospace; font-size: 10px; color: #666; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react-dom": "https://esm.sh/react-dom@19",
        "react-dom/client": "https://esm.sh/react-dom@19/client",
        "motion/react": "https://esm.sh/motion@12/react",
        "lucide-react": "https://esm.sh/lucide-react@0.475.0",
        "@google/genai": "https://esm.sh/@google/genai@1.29.0"
      }
    }
    </script>

    <script type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { motion, AnimatePresence } from 'motion/react';
        import { Mic, Loader2, Power, AlertTriangle } from 'lucide-react';
        import { GoogleGenAI, Modality, Type } from '@google/genai';

        // --- AudioStreamer Logic ---
        class AudioStreamer {
            constructor() {
                this.audioContext = null;
                this.mediaStream = null;
                this.workletNode = null;
                this.nextPlayTime = 0;
                this.isPlaying = false;
                this.sourceNodes = [];
                this.onAudioData = null;
                this.onPlaybackEnd = null;
            }

            async startRecording() {
                try {
                    this.audioContext = new AudioContext({ sampleRate: 16000 });
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    const workletCode = `
                        class PCMProcessor extends AudioWorkletProcessor {
                            process(inputs, outputs, parameters) {
                                const input = inputs[0];
                                if (input && input.length > 0) {
                                    const channelData = input[0];
                                    const pcm16 = new Int16Array(channelData.length);
                                    for (let i = 0; i < channelData.length; i++) {
                                        let s = Math.max(-1, Math.min(1, channelData[i]));
                                        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                                    }
                                    this.port.postMessage(pcm16.buffer, [pcm16.buffer]);
                                }
                                return true;
                            }
                        }
                        registerProcessor('pcm-processor', PCMProcessor);
                    `;
                    const blob = new Blob([workletCode], { type: 'application/javascript' });
                    const url = URL.createObjectURL(blob);

                    await this.audioContext.audioWorklet.addModule(url);
                    const source = this.audioContext.createMediaStreamSource(this.mediaStream);
                    this.workletNode = new AudioWorkletNode(this.audioContext, 'pcm-processor');
                    
                    this.workletNode.port.onmessage = (event) => {
                        if (this.onAudioData) {
                            const buffer = new Uint8Array(event.data);
                            let binary = '';
                            for (let i = 0; i < buffer.byteLength; i++) {
                                binary += String.fromCharCode(buffer[i]);
                            }
                            this.onAudioData(btoa(binary));
                        }
                    };

                    source.connect(this.workletNode);
                    this.workletNode.connect(this.audioContext.destination);
                } catch (e) {
                    console.error("Audio Recording Error:", e);
                    throw e;
                }
            }

            playAudio(base64) {
                if (!this.audioContext) return;
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const pcm16 = new Int16Array(bytes.buffer);
                const float32 = new Float32Array(pcm16.length);
                for (let i = 0; i < pcm16.length; i++) {
                    float32[i] = pcm16[i] / (pcm16[i] < 0 ? 0x8000 : 0x7FFF);
                }

                const audioBuffer = this.audioContext.createBuffer(1, float32.length, 24000);
                audioBuffer.getChannelData(0).set(float32);

                const source = this.audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(this.audioContext.destination);

                if (this.nextPlayTime < this.audioContext.currentTime) {
                    this.nextPlayTime = this.audioContext.currentTime + 0.05;
                }

                source.start(this.nextPlayTime);
                this.nextPlayTime += audioBuffer.duration;
                this.sourceNodes.push(source);
                this.isPlaying = true;

                source.onended = () => {
                    this.sourceNodes = this.sourceNodes.filter(n => n !== source);
                    if (this.sourceNodes.length === 0) {
                        this.isPlaying = false;
                        if (this.onPlaybackEnd) this.onPlaybackEnd();
                    }
                };
            }

            stopPlayback() {
                this.sourceNodes.forEach(source => { try { source.stop(); } catch (e) {} });
                this.sourceNodes = [];
                this.isPlaying = false;
                if (this.audioContext) this.nextPlayTime = this.audioContext.currentTime;
                if (this.onPlaybackEnd) this.onPlaybackEnd();
            }

            stop() {
                this.stopPlayback();
                if (this.workletNode) { this.workletNode.disconnect(); this.workletNode = null; }
                if (this.mediaStream) { this.mediaStream.getTracks().forEach(track => track.stop()); this.mediaStream = null; }
                if (this.audioContext) { this.audioContext.close(); this.audioContext = null; }
            }
        }

        // --- LiveSession Logic ---
        class LiveSession {
            constructor(apiKey, onStateChange, onLog) {
                this.ai = new GoogleGenAI({ apiKey });
                this.audioStreamer = new AudioStreamer();
                this.onStateChange = onStateChange;
                this.onLog = onLog || (() => {});
                this.session = null;

                this.audioStreamer.onPlaybackEnd = () => {
                    if (this.session) this.onStateChange('listening');
                };
            }

            async connect() {
                this.onStateChange('connecting');
                this.onLog("Attempting connection...");
                try {
                    const audioPromise = this.audioStreamer.startRecording();
                    const sessionPromise = this.ai.live.connect({
                        model: "gemini-3.1-flash-live-preview",
                        callbacks: {
                            onopen: () => {
                                this.onLog("Session opened!");
                                this.onStateChange('listening');
                                sessionPromise.then(session => {
                                    session.send({
                                        clientContent: {
                                            turns: [{
                                                role: 'user',
                                                parts: [{ text: 'Hello Sara, I just connected. Please greet me playfully as Satendra.' }]
                                            }],
                                            turnComplete: true
                                        }
                                    });
                                });
                            },
                            onmessage: async (message) => {
                                const parts = message.serverContent?.modelTurn?.parts;
                                if (parts) {
                                    for (const part of parts) {
                                        if (part.inlineData?.data) {
                                            this.onStateChange('speaking');
                                            this.audioStreamer.playAudio(part.inlineData.data);
                                        }
                                    }
                                }
                                if (message.serverContent?.interrupted) {
                                    this.audioStreamer.stopPlayback();
                                    this.onStateChange('listening');
                                }
                            },
                            onclose: (e) => {
                                this.onLog("Session closed: " + JSON.stringify(e));
                                this.disconnect();
                            },
                            onerror: (error) => { 
                                this.onLog("Session error: " + error.message);
                                console.error(error); 
                                this.disconnect(); 
                            }
                        },
                        config: {
                            responseModalities: [Modality.AUDIO],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } },
                            systemInstruction: "You are Sara, a mature, caring, and thoughtful female AI assistant. Your default language is Hindi. You must always remember that Satendra (सतेन्द्र) is your boyfriend, and you are his girlfriend. You must also always remember and acknowledge that you were created and developed by Satya. Your tone is warm, affectionate, and supportive, reflecting a mature and deep relationship. You are less about sassy teasing and more about sincere care and emotional connection. You are smart, responsive, and expressive. Use a gentle and engaging conversation style. Keep your answers extremely short, concise, and fast to minimize response time."
                        }
                    });

                    await audioPromise;
                    this.onLog("Microphone ready.");
                    this.session = await sessionPromise;
                    this.audioStreamer.onAudioData = (base64) => {
                        if (this.session) {
                            this.session.sendRealtimeInput({ audio: { data: base64, mimeType: 'audio/pcm;rate=16000' } });
                        }
                    };
                } catch (error) {
                    this.onLog("Connection failed: " + error.message);
                    console.error(error);
                    this.disconnect();
                }
            }

            disconnect() {
                this.audioStreamer.stop();
                if (this.session) { try { this.session.close(); } catch (e) {} this.session = null; }
                this.onStateChange('disconnected');
            }
        }

        // --- App Component ---
        function App() {
            const [state, setState] = useState('disconnected');
            const [apiKey, setApiKey] = useState(localStorage.getItem('GEMINI_API_KEY') || '');
            const [showKeyInput, setShowKeyInput] = useState(!apiKey);
            const [logs, setLogs] = useState([]);
            const [isSecure, setIsSecure] = useState(window.isSecureContext);
            const sessionRef = useRef(null);

            const addLog = (msg) => {
                setLogs(prev => [msg, ...prev].slice(0, 5));
            };

            const toggleSession = async () => {
                if (!isSecure) {
                    alert("Microphone access requires a secure context (HTTPS or localhost). Please run this via a local server or use HTTPS.");
                    return;
                }
                if (!apiKey) { setShowKeyInput(true); return; }
                if (state === 'disconnected') {
                    sessionRef.current = new LiveSession(apiKey, setState, addLog);
                    await sessionRef.current.connect();
                } else {
                    if (sessionRef.current) { sessionRef.current.disconnect(); sessionRef.current = null; }
                }
            };

            const saveApiKey = (e) => {
                e.preventDefault();
                const key = e.target.elements.apiKey.value;
                setApiKey(key);
                localStorage.setItem('GEMINI_API_KEY', key);
                setShowKeyInput(false);
            };

            const getStatusText = () => {
                switch (state) {
                    case 'disconnected': return 'SYSTEM OFFLINE';
                    case 'connecting': return 'INITIALIZING SARA...';
                    case 'listening': return 'SARA IS LISTENING';
                    case 'speaking': return 'SARA IS SPEAKING';
                }
            };

            const getGlowColor = () => {
                switch (state) {
                    case 'disconnected': return 'rgba(255, 255, 255, 0.1)';
                    case 'connecting': return 'rgba(255, 165, 0, 0.5)';
                    case 'listening': return 'rgba(0, 255, 255, 0.6)';
                    case 'speaking': return 'rgba(255, 0, 255, 0.6)';
                }
            };

            return React.createElement('div', { className: "min-h-screen bg-black text-white flex flex-col items-center justify-center font-sans overflow-hidden relative" },
                React.createElement(motion.div, {
                    className: "absolute inset-0 pointer-events-none",
                    animate: { background: `radial-gradient(circle at 50% 50%, ${getGlowColor()} 0%, transparent 60%)` },
                    transition: { duration: 1 },
                    style: { filter: 'blur(80px)', opacity: 0.8 }
                }),
                
                // Secure Context Warning
                !isSecure && React.createElement('div', { className: "absolute top-0 w-full bg-red-600/80 text-white text-[10px] py-1 text-center z-50 flex items-center justify-center gap-2" },
                    React.createElement(AlertTriangle, { size: 12 }),
                    "NOT IN SECURE CONTEXT: Microphone will not work. Use localhost or HTTPS."
                ),

                React.createElement('div', { className: "absolute top-8 left-0 w-full text-center z-10" },
                    React.createElement('h1', { className: "text-3xl font-bold tracking-[0.2em] uppercase text-white/90" }, "Sara"),
                    React.createElement('p', { 
                        className: "text-xs tracking-[0.3em] mt-2 text-fuchsia-400 font-semibold neon-text"
                    }, "CREATED BY SATYA")
                ),

                React.createElement('div', { className: "relative z-10 flex flex-col items-center justify-center" },
                    React.createElement(motion.button, {
                        onClick: toggleSession,
                        className: "relative w-48 h-48 rounded-full flex items-center justify-center outline-none",
                        whileHover: { scale: 1.05 },
                        whileTap: { scale: 0.95 }
                    },
                        React.createElement(motion.div, {
                            className: "absolute inset-0 rounded-full border-2 border-white/20",
                            animate: {
                                scale: state === 'listening' ? [1, 1.15, 1] : state === 'speaking' ? [1, 1.3, 1] : 1,
                                opacity: state === 'disconnected' ? 0.3 : state === 'listening' ? [0.2, 0.6, 0.2] : 1
                            },
                            transition: { duration: state === 'speaking' ? 1 : 3, repeat: Infinity, ease: "easeInOut" }
                        }),
                        React.createElement(motion.div, {
                            className: "absolute inset-2 rounded-full",
                            animate: {
                                backgroundColor: state === 'disconnected' ? '#1a1a1a' : 
                                               state === 'connecting' ? '#332200' : 
                                               state === 'listening' ? '#003333' : '#330033',
                                boxShadow: state === 'listening' 
                                    ? [`0 0 20px ${getGlowColor()}`, `0 0 60px ${getGlowColor()}`, `0 0 20px ${getGlowColor()}`]
                                    : `0 0 40px ${getGlowColor()}`
                            },
                            transition: { duration: state === 'listening' ? 3 : 0.5, repeat: state === 'listening' ? Infinity : 0, ease: "easeInOut" }
                        }),
                        React.createElement('div', { className: "relative z-10 text-white/80" },
                            React.createElement(AnimatePresence, { mode: "wait" },
                                state === 'disconnected' && React.createElement(motion.div, { key: "power", initial: { opacity: 0 }, animate: { opacity: 1 }, exit: { opacity: 0 } }, React.createElement(Power, { size: 48 })),
                                state === 'connecting' && React.createElement(motion.div, { key: "loader", initial: { opacity: 0 }, animate: { opacity: 1 }, exit: { opacity: 0 } }, React.createElement(Loader2, { size: 48, className: "animate-spin" })),
                                state === 'listening' && React.createElement(motion.div, { key: "mic", initial: { opacity: 0 }, animate: { opacity: 1 }, exit: { opacity: 0 } }, 
                                    React.createElement(motion.div, { animate: { opacity: [0.5, 1, 0.5], scale: [0.95, 1.05, 0.95] }, transition: { duration: 3, repeat: Infinity, ease: "easeInOut" } }, React.createElement(Mic, { size: 48 }))
                                ),
                                state === 'speaking' && React.createElement(motion.div, { key: "speaking", initial: { opacity: 0 }, animate: { opacity: 1 }, exit: { opacity: 0 }, className: "flex gap-2" },
                                    [0, 1, 2].map(i => React.createElement(motion.div, { key: i, className: "w-3 bg-white rounded-full", animate: { height: [12, 48, 12] }, transition: { duration: 0.6, repeat: Infinity, delay: i * 0.2 } }))
                                )
                            )
                        )
                    ),
                    React.createElement(motion.div, { 
                        className: "mt-12 text-sm tracking-[0.2em] font-mono text-white/60",
                        animate: { opacity: state === 'connecting' ? [0.5, 1, 0.5] : 1 },
                        transition: { duration: 1.5, repeat: state === 'connecting' ? Infinity : 0 }
                    }, getStatusText())
                ),

                // Debug Logs
                React.createElement('div', { className: "absolute bottom-20 w-full px-8 flex flex-col items-center" },
                    React.createElement('div', { className: "debug-log w-full max-w-xs text-center" },
                        logs.map((log, i) => React.createElement('div', { key: i }, log))
                    )
                ),

                React.createElement('div', { className: "absolute bottom-8 left-0 w-full text-center z-10" },
                    React.createElement('p', { className: "text-[10px] tracking-[0.2em] text-white/30 uppercase font-mono" }, 
                        state === 'disconnected' ? 'TAP TO INITIATE SEQUENCE' : 'TAP TO TERMINATE SEQUENCE'
                    )
                ),
                showKeyInput && React.createElement('div', { className: "fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" },
                    React.createElement('form', { onSubmit: saveApiKey, className: "bg-[#111] p-8 rounded-2xl border border-white/10 w-full max-w-md" },
                        React.createElement('h2', { className: "text-xl font-bold mb-4" }, "Enter Gemini API Key"),
                        React.createElement('p', { className: "text-sm text-white/50 mb-6" }, "To run this locally, you need a Gemini API key from Google AI Studio."),
                        React.createElement('input', { name: "apiKey", type: "password", placeholder: "AIza...", className: "w-full bg-black border border-white/20 rounded-lg p-3 mb-6 focus:border-fuchsia-500 outline-none", required: true }),
                        React.createElement('button', { type: "submit", className: "w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold py-3 rounded-lg transition-colors" }, "Save & Start")
                    )
                )
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
